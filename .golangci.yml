# golangci-lint v2 configuration. Run locally with: golangci-lint run
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - revive
    - ineffassign
    - govet
    - unused
  settings:
    errcheck:
      check-type-assertions: false
    revive:
      rules:
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck