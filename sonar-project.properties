# SonarQube / SonarQube Cloud analysis settings (used by .github/workflows/sonarqube.yml).
# The server URL and token come from the SONAR_HOST_URL and SONAR_TOKEN repository secrets.
sonar.projectKey=voxnode-ux_nullwire-mcp
sonar.projectName=nullwire-mcp
sonar.organization=voxnode-ux

sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**,packaging/**,scripts/**,**/testdata/**,**/node_modules/**,**/__pycache__/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Reports written by `go test -json` and `-coverprofile` in the workflow.
sonar.go.tests.reportPaths=test-report.json
sonar.go.coverage.reportPaths=cover.out

sonar.sourceEncoding=UTF-8
