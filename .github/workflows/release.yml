name: CI and Release

on:
  workflow_dispatch:   
  push:
    branches: [main] 
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v -race ./...

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: nullwire-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: nullwire-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact: nullwire-linux-armv7
          - goos: linux
            goarch: riscv64
            artifact: nullwire-linux-riscv64
          - goos: darwin
            goarch: amd64
            artifact: nullwire-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: nullwire-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: nullwire-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: nullwire-windows-arm64.exe
          - goos: freebsd
            goarch: amd64
            artifact: nullwire-freebsd-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Cross-compile static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.artifact }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Runs on a pushed v* tag, or when you press Run workflow and give a tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum nullwire-* > SHA256SUMS.txt
      - name: Create or update release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
