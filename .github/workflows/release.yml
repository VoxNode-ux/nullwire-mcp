name: CI and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v1.0.0 (leave as is to publish v1.0.0)"
        required: false
        default: "v1.0.0"
  push:
    branches: [main,VoxNode-ux-patch-1] 
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v -race ./...

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: nullwire-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: nullwire-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact: nullwire-linux-armv7
          - goos: linux
            goarch: riscv64
            artifact: nullwire-linux-riscv64
          - goos: darwin
            goarch: amd64
            artifact: nullwire-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: nullwire-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: nullwire-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: nullwire-windows-arm64.exe
          - goos: freebsd
            goarch: amd64
            artifact: nullwire-freebsd-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Cross-compile static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.artifact }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Runs after tests + all 9 builds pass, on every push, tag and manual run.
    # Never on pull requests, so untrusted code can't touch your releases.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum nullwire-* > SHA256SUMS.txt

      - name: Decide which release this is
        id: rel
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v1.0.0}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
          else
            TAG="latest"
          fi
          case "$TAG" in
            latest) KIND="rolling" ;;
            v[0-9]*) KIND="stable" ;;
            *) echo "::error::Tag must be 'latest' or look like v1.0.0 (got: $TAG)"; exit 1 ;;
          esac
          echo "Publishing $KIND release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          KIND: ${{ steps.rel.outputs.kind }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          ROLL_TITLE="NullWire-MCP Latest Build (main)"
          ROLL_NOTES="Automatic build of the latest commit on main (${GITHUB_SHA::7}). Tests and all 9 platform builds passed. Use a numbered release for a stable version."

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists: replacing its files."
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
            if [ "$KIND" = "rolling" ]; then
              gh release edit "$TAG" --repo "$REPO" \
                --title "$ROLL_TITLE" --notes "$ROLL_NOTES" \
                --prerelease --latest=false
              # Move the tag to the newest commit (create it if it vanished).
              gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true \
                || gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" \
                || echo "::warning::Could not move the $TAG tag; files were still updated."
            fi
          else
            echo "Creating release $TAG."
            if [ "$KIND" = "rolling" ]; then
              gh release create "$TAG" dist/* --repo "$REPO" \
                --target "$GITHUB_SHA" \
                --title "$ROLL_TITLE" --notes "$ROLL_NOTES" \
                --prerelease --latest=false
            else
              gh release create "$TAG" dist/* --repo "$REPO" \
                --target "$GITHUB_SHA" \
                --title "$TAG" --generate-notes
            fi
          fi
   smoke:
    name: Smoke test ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: os: [ubuntu-24.04, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Build and query the MCP server
        shell: bash
        run: |
          go build -o nullwire-smoke.exe .
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | ./nullwire-smoke.exe -port 0 > out.txt 2> err.txt
          grep -q inspect_traffic out.txt
          echo '{"jsonrpc":"2.0","method":"notifications/initialized"}' | ./nullwire-smoke.exe -port 0 > quiet.txt 2>/dev/null
          test ! -s quiet.txt