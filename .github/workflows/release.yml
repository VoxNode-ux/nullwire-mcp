name: CI and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v1.2.0 (leave as is to publish v1.2.0)"
        required: false
        default: "v1.2.0"
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Check the installers for syntax errors
        run: |
          sh -n scripts/install.sh
          sh -n packaging/render.sh
          sh -n docs/install.sh
          cmp scripts/install.sh docs/install.sh   # the GitHub Pages copy must match
          node --check npm/bin/nullwire-mcp.js
          python3 -m py_compile python/src/nullwire_mcp/__init__.py
          for f in packaging/gh-nullwire/gh-nullwire packaging/asdf-nullwire-mcp/bin/* packaging/asdf-nullwire-mcp/lib/utils.bash; do
            bash -n "$f"
          done
      - name: Check all package templates render (Homebrew, Scoop, AUR, winget, Chocolatey)
        run: |
          for a in nullwire-linux-amd64 nullwire-linux-arm64 nullwire-darwin-amd64 nullwire-darwin-arm64 nullwire-windows-amd64.exe nullwire-windows-arm64.exe; do
            printf '%s' "$a" | sha256sum | sed "s/  -/  $a/"
          done > "$RUNNER_TEMP/SHA256SUMS.txt"
          sh packaging/render.sh -v v0.0.0 -s "$RUNNER_TEMP/SHA256SUMS.txt" -o "$RUNNER_TEMP/pkg"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/pkg/nullwire-mcp.json"
          bash -n "$RUNNER_TEMP/pkg/aur/PKGBUILD"
          test -s "$RUNNER_TEMP/pkg/winget/VoxNode.NullWire.installer.yaml"
          test -s "$RUNNER_TEMP/pkg/choco/nullwire-mcp.nuspec"
      - name: go vet
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee vet.txt
      - name: go test
        run: |
          set -o pipefail
          go test -v -race ./... 2>&1 | tee test.txt
      - name: Save vet and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-logs
          path: |
            vet.txt
            test.txt
          retention-days: 30

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: nullwire-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: nullwire-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact: nullwire-linux-armv7
          - goos: linux
            goarch: riscv64
            artifact: nullwire-linux-riscv64
          - goos: darwin
            goarch: amd64
            artifact: nullwire-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: nullwire-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: nullwire-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: nullwire-windows-arm64.exe
          - goos: freebsd
            goarch: amd64
            artifact: nullwire-freebsd-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Cross-compile static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.artifact }}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    # Plain docker commands instead of third-party actions: the Dockerfile
    # cross-compiles, so no emulation is needed and nothing extra has to be pinned.
    env:
      IMAGE: ghcr.io/voxnode-ux/nullwire-mcp
      EVENT: ${{ github.event_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Build, and push outside pull requests
        run: |
          set -euo pipefail
          docker buildx create --name nullwire --driver docker-container --use
          args=(--platform linux/amd64,linux/arm64 --tag "${IMAGE}:${SHA}")
          if [ "${EVENT}" = "pull_request" ]; then
            echo "Pull request: building without pushing."
          else
            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
            args+=(--tag "${IMAGE}:latest")
            if [ "${REF_TYPE}" = "tag" ]; then
              args+=(--tag "${IMAGE}:${REF_NAME}")
            fi
            args+=(--push)
          fi
          docker buildx build "${args[@]}" --metadata-file "$RUNNER_TEMP/meta.json" .
      - name: Sign the pushed image with cosign (keyless)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          case "$digest" in sha256:*) ;; *) echo "::error::no image digest in the build metadata"; exit 1 ;; esac
          "$(go env GOPATH)/bin/cosign" sign --yes "${IMAGE}@${digest}"

  release:
    name: Publish release
    needs: [build, docker]
    # Runs after tests, all 9 builds and the Docker image pass, on every push, tag and manual run.
    # Never on pull requests, so untrusted code can't touch your releases.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      kind: ${{ steps.rel.outputs.kind }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: nullwire-*
          path: dist
          merge-multiple: true

      - name: Decide which release this is
        id: rel
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v1.2.0}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
          else
            TAG="latest"
          fi
          case "$TAG" in
            latest) KIND="rolling" ;;
            v[0-9]*.[0-9]*.[0-9]*) KIND="stable" ;;
            *) echo "::error::Tag must be 'latest' or look like v1.2.0 (got: $TAG)"; exit 1 ;;
          esac
          echo "Publishing $KIND release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: SBOM (list of everything in the build)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json -output dist/nullwire-sbom.cdx.json .
          echo "SBOM written:"; ls -l dist/nullwire-sbom.cdx.json

      - name: Linux packages (.deb, .rpm, .apk) with nfpm
        if: steps.rel.outputs.kind == 'stable'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
          NFPM="$(go env GOPATH)/bin/nfpm"
          export VERSION="${TAG#v}"
          for pair in amd64:linux-amd64 arm64:linux-arm64 arm7:linux-armv7; do
            export NFPM_ARCH="${pair%%:*}"
            export BIN_SRC="dist/nullwire-${pair#*:}"
            for fmt in deb rpm apk; do
              "$NFPM" package -p "$fmt" -f nfpm.yaml -t dist/
            done
          done
          ls -l dist/*.deb dist/*.rpm dist/*.apk

      - name: Checksums
        run: cd dist && sha256sum nullwire-* > SHA256SUMS.txt

      - name: Build provenance (signed proof of where each binary came from)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/nullwire-*"

      - name: Attach the provenance file to the release
        # Puts the signed proof next to the binaries as a normal release file,
        # so tools like OpenSSF Scorecard (and people) can find it.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE"
          cp "$BUNDLE" dist/nullwire-provenance.intoto.jsonl
          ls -l dist/nullwire-provenance.intoto.jsonl

      - name: Sign the files with cosign (keyless, Sigstore)
        # One .sigstore.json bundle per file, next to it on the release. Verify with:
        #   cosign verify-blob --bundle FILE.sigstore.json \
        #     --certificate-identity-regexp 'https://github.com/VoxNode-ux/nullwire-mcp/\.github/workflows/release\.yml@.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE
        run: |
          set -euo pipefail
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
          COSIGN="$(go env GOPATH)/bin/cosign"
          cd dist
          for f in nullwire-* SHA256SUMS.txt; do
            case "$f" in *.sigstore.json|nullwire-provenance.intoto.jsonl) continue ;; esac
            "$COSIGN" sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l ./*.sigstore.json

      - name: Create or update the release
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          KIND: ${{ steps.rel.outputs.kind }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          ROLL_TITLE="NullWire-MCP Latest Build (main)"
          ROLL_NOTES="Automatic build of the latest commit on main (${GITHUB_SHA::7}). Tests and all 9 platform builds passed. Use a numbered release for a stable version."

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists: replacing its files."
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
            if [ "$KIND" = "rolling" ]; then
              gh release edit "$TAG" --repo "$REPO" \
                --title "$ROLL_TITLE" --notes "$ROLL_NOTES" \
                --prerelease --latest=false
              # Move the tag to the newest commit (create it if it vanished).
              gh api -X PATCH "repos/$REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true \
                || gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" \
                || echo "::warning::Could not move the $TAG tag; files were still updated."
            fi
          else
            echo "Creating release $TAG."
            if [ "$KIND" = "rolling" ]; then
              gh release create "$TAG" dist/* --repo "$REPO" \
                --target "$GITHUB_SHA" \
                --title "$ROLL_TITLE" --notes "$ROLL_NOTES" \
                --prerelease --latest=false
            else
              gh release create "$TAG" dist/* --repo "$REPO" \
                --target "$GITHUB_SHA" \
                --title "$TAG" --generate-notes
            fi
          fi

      - name: Publish the npm launcher (with provenance)
        if: steps.rel.outputs.kind == 'stable'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping the npm publish"
            exit 0
          fi
          VER="${TAG#v}"
          cd npm
          if npm view "nullwire-mcp@$VER" version >/dev/null 2>&1; then
            echo "nullwire-mcp@$VER is already on npm; nothing to do"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.TAG.slice(1);
            p.nullwireRelease = process.env.TAG;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          npm publish --provenance --access public --userconfig "$RUNNER_TEMP/npmrc"

  distribute:
    name: Package managers
    needs: release
    if: needs.release.outputs.kind == 'stable'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
