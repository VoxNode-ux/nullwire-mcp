name: CI and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v1.2.0"
        required: false
        default: "v1.2.0"
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26"
          cache: false
      - run: go vet ./...
      - run: go test -v -race ./...

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: nullwire-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: nullwire-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: nullwire-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: nullwire-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: nullwire-windows-amd64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26"
          cache: false
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${ARTIFACT}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  docker:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Plain docker commands instead of third-party actions: the Dockerfile
    # cross-compiles, so no emulation is needed and nothing extra has to be pinned.
    env:
      IMAGE: ghcr.io/voxnode-ux/nullwire-mcp
      EVENT: ${{ github.event_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      ACTOR: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build, and push outside pull requests
        run: |
          set -euo pipefail
          docker buildx create --name nullwire --driver docker-container --use
          args=(--platform linux/amd64,linux/arm64 --tag "${IMAGE}:${SHA}")
          if [ "${EVENT}" = "pull_request" ]; then
            echo "Pull request: building without pushing."
          else
            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
            args+=(--tag "${IMAGE}:latest")
            if [ "${REF_TYPE}" = "tag" ]; then
              args+=(--tag "${IMAGE}:${REF_NAME}")
            fi
            args+=(--push)
          fi
          docker buildx build "${args[@]}" .

  release:
    name: Publish release
    needs: [build, docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: nullwire-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum nullwire-* > SHA256SUMS.txt
      - name: Decide which release this is
        id: rel
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v1.2.0}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            TAG="${REF_NAME}"
          else
            TAG="latest"
          fi
          case "${TAG}" in
            latest|v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag must be 'latest' or look like v1.2.0 (got: ${TAG})"; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --target "${GITHUB_SHA}" --generate-notes
          fi
