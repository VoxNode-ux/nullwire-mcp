name: Mutation testing (manual, gremlins)

# Manual only: never runs on pull requests, pushes or a schedule.
# Start it from the Actions tab (or the GitHub mobile app): pick this workflow,
# tap "Run workflow", choose ANY branch in "Use workflow from", then choose the
# packages. It checks out the branch you picked and mutates only the packages
# you selected. Nothing in the repository is changed.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Which packages to mutate"
        type: choice
        default: all
        options:
          - all
          - app
          - cliio
          - install
          - scan
          - protect
          - vendors
      threshold:
        description: "Fail a package below this efficacy % (0 = report only)"
        type: string
        default: "0"
      workers:
        description: "Parallel gremlins workers per package (lower = fewer timeouts)"
        type: string
        default: "2"

permissions:
  contents: read

concurrency:
  group: mutation-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.4"
  GREMLINS_VERSION: "v0.6.0"

jobs:
  plan:
    name: Choose packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Build the package list
        id: pick
        env:
          CHOICE: ${{ inputs.packages }}
        run: |
          set -eu
          case "$CHOICE" in
            all)     m='[{"name":"app","path":"./internal/app"},{"name":"cliio","path":"./internal/cliio"},{"name":"install","path":"./internal/install"},{"name":"scan","path":"./internal/scan"},{"name":"protect","path":"./internal/protect"},{"name":"vendors","path":"./internal/vendors"}]' ;;
            app)     m='[{"name":"app","path":"./internal/app"}]' ;;
            cliio)   m='[{"name":"cliio","path":"./internal/cliio"}]' ;;
            install) m='[{"name":"install","path":"./internal/install"}]' ;;
            scan)    m='[{"name":"scan","path":"./internal/scan"}]' ;;
            protect) m='[{"name":"protect","path":"./internal/protect"}]' ;;
            vendors) m='[{"name":"vendors","path":"./internal/vendors"}]' ;;
            *) echo "unknown package choice: $CHOICE" >&2; exit 1 ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  gremlins:
    name: Gremlins (${{ matrix.pkg.name }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}
      - name: Mutate ${{ matrix.pkg.path }}
        env:
          PKG: ${{ matrix.pkg.path }}
          THRESHOLD: ${{ inputs.threshold }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set -o pipefail
          echo "branch: ${GITHUB_REF_NAME}  commit: ${GITHUB_SHA}"
          "$(go env GOPATH)/bin/gremlins" unleash \
            --workers "$WORKERS" \
            --threshold-efficacy "$THRESHOLD" \
            "$PKG" 2>&1 | tee gremlins.txt
      - name: Summarize the mutation score
        if: always()
        env:
          NAME: ${{ matrix.pkg.name }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          {
            echo "## Mutation testing: internal/${NAME} (branch \`${GITHUB_REF_NAME}\`, threshold ${THRESHOLD}%)"
            if [ ! -s gremlins.txt ]; then
              echo "_No gremlins report generated._"
              exit 0
            fi
            echo '```text'
            grep -E '^(Mutation testing|Killed:|Lived:|Timed out:|Not covered:|Test efficacy:|Mutator coverage:)' gremlins.txt || tail -n 40 gremlins.txt
            echo '```'
            if grep -q 'LIVED' gremlins.txt; then
              echo "### Surviving mutants (LIVED)"
              echo '```text'
              grep -E 'LIVED' gremlins.txt | head -n 80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gremlins-${{ matrix.pkg.name }}
          path: gremlins.txt
          if-no-files-found: ignore
          retention-days: 30
