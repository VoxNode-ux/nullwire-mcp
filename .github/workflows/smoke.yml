name: Smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Build and query the MCP server
        id: basic
        shell: bash
        run: |
          go build -o nullwire-smoke.exe .
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | ./nullwire-smoke.exe -port 0 > out.txt 2> err.txt
          grep -q inspect_traffic out.txt
          echo '{"jsonrpc":"2.0","method":"notifications/initialized"}' | ./nullwire-smoke.exe -port 0 > quiet.txt 2>/dev/null
          test ! -s quiet.txt

      - name: Redaction end-to-end (local upstream, no internet)
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          mkdir -p upstream && echo ok > upstream/index.html
          "$PY" -m http.server 18081 --bind 127.0.0.1 --directory upstream > upstream.log 2>&1 &
          UP=$!
          for i in $(seq 1 40); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:18081/; then break; fi
            sleep 0.5
          done
          rm -f go.flag
          ( while [ ! -f go.flag ]; do sleep 0.5; done
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"inspect_traffic","arguments":{"limit":5}}}'
            sleep 2 ) | ./nullwire-smoke.exe -port 18080 -target http://127.0.0.1:18081 > e2e-out.txt 2> e2e-err.txt &
          NW=$!
          for i in $(seq 1 20); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:18080/; then break; fi
            sleep 0.5
          done
          { date; if command -v lsof >/dev/null; then lsof -nP -iTCP:18080 -iTCP:18081; fi; } > e2e-ports.txt 2>&1 || true
          curl -sS -v --max-time 10 http://127.0.0.1:18080/ \
            -H "Authorization: Bearer my_secret_token_123" \
            -H "Cookie: sid=my_secret_cookie" \
            -H "X-Forwarded-For: 198.51.100.1" > e2e-curl.txt 2>&1 || echo "curl exit code $?" >> e2e-curl.txt
          touch go.flag
          wait $NW || true
          kill $UP 2>/dev/null || true
          grep -q 'REDACTED_TOKEN#' e2e-out.txt
          grep -q 'REDACTED_COOKIE#' e2e-out.txt
          grep -q 'REDACTED_IP#' e2e-out.txt
          if grep -q 'my_secret_token_123\|my_secret_cookie\|198.51.100.1' e2e-out.txt; then
            echo "SECRET LEAKED into output"; exit 1
          fi

      - name: Collect system info and summary
        if: always()
        shell: bash
        run: |
          {
            echo "os_label=${{ matrix.os }}"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            go version
            echo "basic=${{ steps.basic.outcome }}"
            echo "e2e=${{ steps.e2e.outcome }}"
          } > info.txt
          {
            echo "### ${{ matrix.os }}"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Build + MCP answers + silent notifications | ${{ steps.basic.outcome }} |"
            echo "| Redaction end-to-end | ${{ steps.e2e.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: |
            info.txt
            out.txt
            err.txt
            quiet.txt
            e2e-out.txt
            e2e-err.txt
            e2e-curl.txt
            e2e-ports.txt
            upstream.log
          if-no-files-found: ignore
          retention-days: 14
 