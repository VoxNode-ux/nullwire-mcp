name: Code quality

# Lint, coverage and performance benchmarks. Lint and benchmarks are advisory
# at first (they report but do not fail the build); remove `continue-on-error`
# once the first findings are cleaned up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Install golangci-lint (built with the Go version above)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
      - name: Lint (errcheck, staticcheck, revive, ineffassign, govet, unused)
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/golangci-lint" run ./... 2>&1 | tee lint.txt
      - name: Save the lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-report
          path: lint.txt
          retention-days: 30

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Run the tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload to Codecov (skipped until CODECOV_TOKEN is set)
        if: env.CODECOV_TOKEN != ''
        # TODO: pin to a full commit hash like the other actions (run "Pin helper").
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 30

  bench:
    name: Benchmarks (benchstat)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Benchmark this commit
        run: go test -run='^$' -bench=. -benchmem -count=6 ./internal/app | tee new.txt
      - name: Benchmark the base branch and compare (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
          mkdir -p "$RUNNER_TEMP/base/internal/app" && cp internal/app/bench_test.go "$RUNNER_TEMP/base/internal/app/"   # the base may not have the benchmarks yet
          (cd "$RUNNER_TEMP/base" && go test -run='^$' -bench=. -benchmem -count=6 ./internal/app | tee "$GITHUB_WORKSPACE/old.txt")
          {
            echo '### Benchmark comparison (base -> this PR)'
            echo '```'
            "$(go env GOPATH)/bin/benchstat" old.txt new.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary (pushes)
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '### Benchmarks'
            echo '```'
            "$(go env GOPATH)/bin/benchstat" new.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmarks
          path: |
            new.txt
            old.txt
          if-no-files-found: ignore
          retention-days: 30