name: Benchmarks (speed, load and DLP accuracy)

# Workflow 2. Measures the proxy; it never gates a merge.
#   hey (HTTP/1.1 load) + h2load (HTTP/2 cleartext load) + k6 (SSE streaming)
#   + hyperfine (CLI/scan speed) + Samsung CredData & SecretBench (DLP accuracy)
#   + native probes: MCP handshake, tool-call latency (empty and 50 flows),
#     binary size, scrubber CPU, memory footprint (VmRSS / heap in use),
#     big body + secret stress, gRPC / gRPC-Web over h2c, and a bash + hey soak
#   + gitleaks / trufflehog before-and-after on trufflesecurity/test_keys.
# Everything is installed on the runner. Nothing changes the repository.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3"   # Wednesdays 05:17 UTC, on the default branch

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.2"
  HEY_VERSION: "v0.1.5"
  K6_VERSION: "v2.4.0"
  K6_SHA256: "5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87"
  HYPERFINE_VERSION: "v2.0.0"

jobs:
  # ------------------------------------------------------------------ 1
  speed:
    name: Speed and load (hey, h2load, k6, hyperfine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false

      - name: Install hey (pinned Go module, go.sum verified)
        run: |
          set -e
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rakyll/hey@${HEY_VERSION}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install h2load (nghttp2-client from Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nghttp2-client
      - name: Install k6 and hyperfine
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o k6.tgz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          echo "${K6_SHA256}  k6.tgz" | sha256sum -c -
          tar -xzf k6.tgz --strip-components=1 -C bin "k6-${K6_VERSION}-linux-amd64/k6"
          curl -fsSL -o hf.tgz "https://github.com/sharkdp/hyperfine/releases/download/${HYPERFINE_VERSION}/hyperfine-${HYPERFINE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum hf.tgz
          tar -xzf hf.tgz --strip-components=1 -C bin "hyperfine-${HYPERFINE_VERSION}-x86_64-unknown-linux-gnu/hyperfine"
          k6 version; hyperfine --version; hey -n 1 http://127.0.0.1:1/ 2>&1 | head -1 || true

      - name: Build NullWire and a local HTTP/1.1 + h2c + SSE upstream
        run: |
          set -e
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o nullwire-mcp .
          mkdir -p "$RUNNER_TEMP/up" && cd "$RUNNER_TEMP/up"
          cat > main.go <<'GO'
          package main

          import (
          	"fmt"
          	"net/http"
          	"time"
          )

          func main() {
          	mux := http.NewServeMux()
          	mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) { w.Write([]byte("ok\n")) })
          	mux.HandleFunc("/sse", func(w http.ResponseWriter, r *http.Request) {
          		w.Header().Set("Content-Type", "text/event-stream")
          		f := w.(http.Flusher)
          		for i := 0; i < 20; i++ {
          			fmt.Fprintf(w, "data: {\"n\":%d}\n\n", i)
          			f.Flush()
          			time.Sleep(10 * time.Millisecond)
          		}
          	})
          	var p http.Protocols
          	p.SetHTTP1(true)
          	p.SetUnencryptedHTTP2(true)
          	s := &http.Server{Addr: "127.0.0.1:18081", Handler: mux, Protocols: &p}
          	panic(s.ListenAndServe())
          }
          GO
          go mod init upstream >/dev/null 2>&1
          go build -o "$GITHUB_WORKSPACE/upstream" .
      - name: Start upstream and NullWire
        run: |
          ./upstream > upstream.log 2>&1 &
          echo $! > upstream.pid
          ./nullwire-mcp -port 18080 -target http://127.0.0.1:18081 < <(sleep 3000) > nw.out 2> nw.err &
          echo $! > nw.pid
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/ >/dev/null

      - name: hey (HTTP/1.1), direct vs through NullWire
        id: hey
        run: |
          hey -z 10s -c 50 http://127.0.0.1:18081/ > hey-direct.txt
          hey -z 10s -c 50 http://127.0.0.1:18080/ > hey-proxy.txt
      - name: h2load (HTTP/2 cleartext), direct vs through NullWire
        id: h2load
        run: |
          h2load -n 50000 -c 20 -m 10 http://127.0.0.1:18081/ > h2-direct.txt
          h2load -n 50000 -c 20 -m 10 http://127.0.0.1:18080/ > h2-proxy.txt
      - name: k6 (SSE streaming through NullWire)
        id: k6
        run: |
          cat > sse.js <<'JS'
          import http from 'k6/http';
          import { check } from 'k6';
          export const options = {
            vus: 20, duration: '15s',
            thresholds: { checks: ['rate>0.99'] },
          };
          export default function () {
            const r = http.get('http://127.0.0.1:18080/sse');
            check(r, {
              'status 200': (x) => x.status === 200,
              'all 20 events arrived': (x) => (x.body.match(/^data:/gm) || []).length === 20,
            });
          }
          JS
          k6 run --summary-export=k6-sse.json sse.js 2>&1 | tee k6-sse.txt
      - name: SSE overhead (direct vs through NullWire; upstream floor is 20 x 10 ms)
        id: ssedirect
        run: |
          python3 - <<'PY'
          import time, urllib.request, json
          def run(url, n=100):
              ts = []
              for _ in range(n):
                  t = time.perf_counter()
                  with urllib.request.urlopen(url) as r:
                      body = r.read()
                  assert body.count(b"data:") == 20
                  ts.append((time.perf_counter() - t) * 1000)
              ts.sort()
              return sum(ts) / len(ts), ts[len(ts) // 2]
          run("http://127.0.0.1:18081/sse", 5)  # warm-up
          run("http://127.0.0.1:18080/sse", 5)
          d_avg, d_med = run("http://127.0.0.1:18081/sse")
          p_avg, p_med = run("http://127.0.0.1:18080/sse")
          res = {"sse_direct_ms": round(d_avg, 2), "sse_proxy_ms": round(p_avg, 2),
                 "sse_overhead_ms": round(p_avg - d_avg, 2),
                 "sse_direct_median_ms": round(d_med, 2), "sse_proxy_median_ms": round(p_med, 2),
                 "sse_overhead_median_ms": round(p_med - d_med, 2)}
          json.dump(res, open("sse-overhead.json", "w"), indent=2)
          print(res)
          PY
      - name: hyperfine (startup, tools/list and scan)
        id: hyperfine
        run: |
          printf 'API_KEY=ghp_abcdefghijklmnopqrstuvwxyz0123456789\nHOST=198.51.100.7\n' > sample.env
          hyperfine --warmup 3 --runs 30 --export-markdown hyperfine.md \
            --input <(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}') \
            './nullwire-mcp -port 0' \
            './nullwire-mcp scan sample.env'
          hyperfine --warmup 3 --runs 30 --export-markdown hyperfine-handshake.md \
            --input <(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"hf","version":"0"}}}') \
            './nullwire-mcp -port 0'
          cat hyperfine-handshake.md >> hyperfine.md

      - name: Binary size
        id: binsize
        run: |
          ls -lh nullwire-mcp
          { echo "### Binary size"; echo "    $(stat -c %s nullwire-mcp) bytes ($(ls -lh nullwire-mcp | awk '{print $5}'))"; } >> binsize.md
      - name: Scrubber CPU speed (go test -bench)
        id: scrubbench
        run: |
          set -o pipefail
          go test -run='^$' -bench='Scrub' -benchmem -count=3 ./internal/app | tee scrub-bench.txt
      - name: Memory footprint (heap in use via pprof, after the proxy round-trip benchmark)
        id: heap
        run: |
          set -o pipefail
          go test -run='^$' -bench='BenchmarkProxyRoundTrip' -benchtime=2000x -memprofile mem.out -memprofilerate=1 ./internal/app > /dev/null
          go tool pprof -sample_index=inuse_space -top -nodecount=5 mem.out 2>&1 | tee heap-inuse.txt
      - name: MCP probes (handshake, tool-call latency, VmRSS, big body + secret)
        id: mcpprobe
        run: python3 .github/scripts/mcp-probe.py "$PWD/nullwire-mcp" 18090 http://127.0.0.1:18081
      - name: Big body + secret stress load (hey -m POST, 1 MiB body)
        id: bigbody
        run: |
          python3 - <<'PY'
          import random, string
          s = "ghp_" + "".join(random.choice(string.ascii_letters + string.digits) for _ in range(36))
          open("bigbody.txt", "w").write("A" * (32768 - 20) + s + "B" * (1 << 20))
          PY
          hey -z 10s -c 10 -m POST -T application/octet-stream -D bigbody.txt http://127.0.0.1:18081/ > bigbody-direct.txt
          hey -z 10s -c 10 -m POST -T application/octet-stream -D bigbody.txt http://127.0.0.1:18080/ > bigbody-proxy.txt
          echo "VmRSS after load: $(grep VmRSS /proc/$(cat nw.pid)/status)" | tee bigbody-rss.txt
      - name: gRPC and gRPC-Web throughput (h2load over h2c, POST)
        id: grpc
        run: |
          printf '\x00\x00\x00\x00\x07\x0a\x05hello' > grpc-frame.bin
          for ct in application/grpc application/grpc-web+proto; do
            n=$(echo "$ct" | tr '/+' '__')
            for side in direct:18081 proxy:18080; do
              h2load -n 20000 -c 10 -m 10 -d grpc-frame.bin -H "content-type: $ct" -H 'te: trailers' \
                "http://127.0.0.1:${side#*:}/pkg.Svc/Method" > "grpc-${n}-${side%%:*}.txt" 2>&1 || true
            done
          done

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Speed and load"
            for f in hey-direct hey-proxy; do
              echo "### $f"; grep -E "Requests/sec|Average:|99% in|\[200\]" $f.txt 2>/dev/null | sed 's/^/    /'
            done
            for f in h2-direct h2-proxy; do
              echo "### $f"; grep -E "^finished in|^requests:|^status codes|^time for request" $f.txt 2>/dev/null | sed 's/^/    /'
            done
            echo "### k6 SSE"; grep -E "checks|http_req_duration|iterations" k6-sse.txt 2>/dev/null | sed 's/^/    /'
            echo "### SSE overhead (proxy minus direct, one 20-event stream)"; sed 's/^/    /' sse-overhead.json 2>/dev/null
            echo "### hyperfine"; cat hyperfine.md 2>/dev/null
            cat binsize.md 2>/dev/null
            echo "### Scrubber CPU (go test -bench)"; grep -E "^Benchmark" scrub-bench.txt 2>/dev/null | sed 's/^/    /'
            echo "### Heap in use (pprof)"; head -n 8 heap-inuse.txt 2>/dev/null | sed 's/^/    /'
            for f in bigbody-direct bigbody-proxy; do
              echo "### $f (1 MiB POST + secret)"; grep -E "Requests/sec|Average:|99% in|\[200\]" $f.txt 2>/dev/null | sed 's/^/    /'
            done
            cat bigbody-rss.txt 2>/dev/null | sed 's/^/    /'
            for f in grpc-application_grpc-direct grpc-application_grpc-proxy grpc-application_grpc-web_proto-direct grpc-application_grpc-web_proto-proxy; do
              echo "### $f"; grep -E "^finished in|^requests:|^status codes" $f.txt 2>/dev/null | sed 's/^/    /'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Review (step results)
        if: always()
        run: |
          {
            echo "## Review: speed and load"
            echo "| Section | Result |"
            echo "|---|---|"
            echo "| hey (HTTP/1.1) | ${{ steps.hey.outcome }} |"
            echo "| h2load (HTTP/2) | ${{ steps.h2load.outcome }} |"
            echo "| k6 (SSE) | ${{ steps.k6.outcome }} |"
            echo "| SSE overhead (direct vs proxy) | ${{ steps.ssedirect.outcome }} |"
            echo "| hyperfine | ${{ steps.hyperfine.outcome }} |"
            echo "| binary size | ${{ steps.binsize.outcome }} |"
            echo "| scrubber CPU (go test -bench) | ${{ steps.scrubbench.outcome }} |"
            echo "| heap in use (pprof) | ${{ steps.heap.outcome }} |"
            echo "| MCP probes (handshake, latency, VmRSS, big body + secret) | ${{ steps.mcpprobe.outcome }} |"
            echo "| big body + secret stress (hey -m POST) | ${{ steps.bigbody.outcome }} |"
            echo "| gRPC / gRPC-Web (h2load h2c) | ${{ steps.grpc.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop background processes
        if: always()
        run: kill $(cat upstream.pid nw.pid 2>/dev/null) 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: speed-results
          path: |
            hey-*.txt
            h2-*.txt
            k6-sse.*
            sse-overhead.json
            hyperfine.md
            binsize.md
            scrub-bench.txt
            heap-inuse.txt
            mcp-probe.json
            bigbody-*.txt
            grpc-*.txt
            nw.err
            upstream.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------ 2
  dlp-accuracy:
    name: DLP accuracy (Samsung CredData and SecretBench)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Build NullWire
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o nullwire-mcp .
      - name: Clone the datasets (shallow)
        run: |
          git clone --depth 1 https://github.com/Samsung/CredData.git creddata
          git clone --depth 1 https://github.com/setu1421/SecretBench.git secretbench
          git -C creddata rev-parse HEAD
          git -C secretbench rev-parse HEAD
      - name: Fetch CredData sample files
        id: fetch
        run: |
          cd creddata
          python3 -m pip install --user -r requirements.txt >/dev/null 2>&1 || true
          python3 download_data.py --data_dir data --jobs 4 2>&1 | tail -5 || echo "download step failed; scoring uses whatever is present"
      - name: Score recall and false positives with nullwire-mcp scan
        id: score
        run: |
          cat > score.py <<'PY'
          import csv, glob, os, re, subprocess, sys, json
          os.makedirs("work", exist_ok=True)
          tp = fp = 0
          hit_tp = hit_fp = 0
          rows = []
          for m in sorted(glob.glob("creddata/meta/*.csv")):
              with open(m, newline="", encoding="utf-8", errors="replace") as f:
                  for r in csv.DictReader(f):
                      label = r.get("GroundTruth") or r.get("Label")
                      line = (r.get("LineStart:LineEnd") or r.get("LineStart") or "").split(":")[0]
                      rel = r.get("FilePath", "")
                      path = os.path.join("creddata", "data", rel)
                      if not os.path.isfile(path):
                          path = os.path.join("creddata", rel)
                      if label not in ("T", "F") or not line.isdigit() or not os.path.isfile(path):
                          continue
                      try:
                          text = open(path, encoding="utf-8", errors="replace").read().splitlines()
                          src = text[int(line) - 1]
                      except Exception:
                          continue
                      s, e = r.get("ValueStart"), r.get("ValueEnd")
                      val = src[int(s):int(e)] if (s or "").isdigit() and (e or "").isdigit() else src
                      if val and "\n" not in val and len(val) < 2000:
                          rows.append((label, val))
              if len(rows) > 20000: break
          rows = rows[:20000]
          with open("work/cred.env", "w") as f:
              for i, (_, v) in enumerate(rows):
                  f.write("CRED_%d=%s\n" % (i, v.replace("\r", "")))
          out = subprocess.run(["./nullwire-mcp", "scan", "work/cred.env"], capture_output=True, text=True).stdout
          flagged = {int(m.group(1)) for m in re.finditer(r"^\s+line\s+(\d+)\s", out, re.M)}
          for i, (label, _) in enumerate(rows, 1):
              if label == "T":
                  tp += 1; hit_tp += i in flagged
              else:
                  fp += 1; hit_fp += i in flagged
          res = {"true_samples": tp, "recall": round(hit_tp / tp, 4) if tp else None,
                 "false_samples": fp, "false_positive_rate": round(hit_fp / fp, 4) if fp else None}
          json.dump(res, open("creddata-result.json", "w"), indent=2)
          print(res)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## DLP accuracy (CredData, value-level, indicative)\n```json\n%s\n```\n" % json.dumps(res, indent=2))
              if not rows:
                  s.write("_No labelled CredData samples were available on the runner._\n")
          PY
          python3 score.py
      - name: SecretBench inventory
        id: sb
        run: |
          {
            echo "## SecretBench"
            echo "- Commit: \`$(git -C secretbench rev-parse --short HEAD)\`"
            echo "- Data files found: $(find secretbench -type f \( -name '*.csv' -o -name '*.json' -o -name '*.parquet' \) | wc -l)"
            echo "_The labelled corpus is distributed separately by the authors; this run scores it only when the files are in the clone._"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install gitleaks and trufflehog (checksum-verified)
        id: scanners
        uses: ./.github/actions/install-scanners
      - name: Scanner before/after on trufflesecurity/test_keys (informational)
        id: testkeys
        run: |
          git clone --depth 1 https://github.com/trufflesecurity/test_keys.git test_keys
          rev=$(git -C test_keys rev-parse HEAD); echo "test_keys commit: $rev"
          mkdir -p tk-raw tk-report
          python3 - <<'PY'
          import os
          n = 0
          with open("tk-raw/test_keys.env", "w") as out:
              for root, dirs, files in os.walk("test_keys"):
                  dirs[:] = [d for d in dirs if d != ".git"]
                  for fn in files:
                      for line in open(os.path.join(root, fn), encoding="utf-8", errors="replace").read().splitlines():
                          if line.strip() and len(line) < 2000:
                              n += 1; out.write("TK_%d=%s\n" % (n, line))
          print("lines written:", n)
          PY
          ./nullwire-mcp scan tk-raw/test_keys.env > tk-report/nullwire-report.txt 2>&1 || true
          gl() { gitleaks dir "$1" --no-banner --redact --exit-code 0 --report-format json --report-path gl.json >/dev/null 2>&1 || true; python3 -c 'import json;print(len(json.load(open("gl.json")) or []))'; }
          th() { trufflehog filesystem "$1" --no-verification --no-update --json 2>/dev/null | grep -c '"SourceMetadata"' || true; }
          {
            echo "## Scanner before/after (trufflesecurity/test_keys @ \`${rev:0:7}\`)"
            echo "| Scanner | Findings in raw lines | Findings left in NullWire report |"
            echo "|---|---|---|"
            echo "| gitleaks | $(gl tk-raw) | $(gl tk-report) |"
            echo "| trufflehog | $(th tk-raw) | $(th tk-report) |"
            echo "_Indicative: the lines are flattened into an env file, so this measures value-level redaction only._"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Review (step results)
        if: always()
        run: |
          {
            echo "## Review: DLP accuracy"
            echo "| Section | Result |"
            echo "|---|---|"
            echo "| test_keys before/after (gitleaks, trufflehog) | ${{ steps.testkeys.outcome }} |"
            echo "| CredData download | ${{ steps.fetch.outcome }} |"
            echo "| CredData scoring | ${{ steps.score.outcome }} |"
            echo "| SecretBench inventory | ${{ steps.sb.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dlp-accuracy
          path: creddata-result.json
          if-no-files-found: ignore

  # ------------------------------------------------------------------ 3
  soak:
    name: Memory leak soak (bash + hey)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: false
      - name: Install hey (pinned Go module, go.sum verified)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rakyll/hey@${HEY_VERSION}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build NullWire and start a tiny upstream
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o nullwire-mcp .
          python3 - <<'PY' > upstream.log 2>&1 &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          class H(BaseHTTPRequestHandler):
              def _ok(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  if n: self.rfile.read(n)
                  self.send_response(200); self.send_header("Content-Length", "3"); self.end_headers(); self.wfile.write(b"ok\n")
              do_GET = do_POST = _ok
              def log_message(self, *a): pass
          ThreadingHTTPServer(("127.0.0.1", 18081), H).serve_forever()
          PY
          echo $! > upstream.pid
          ./nullwire-mcp -port 18080 -target http://127.0.0.1:18081 < <(sleep 3000) > nw.out 2> nw.err &
          echo $! > nw.pid
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/ >/dev/null
      - name: Soak (24 rounds of 10 s, secrets in every body; VmRSS after each round)
        id: soak
        run: |
          pid=$(cat nw.pid)
          body='{"token":"ghp_abcdefghijklmnopqrstuvwxyz0123456789","n":1}'
          echo "round,vmrss_kb" > soak.csv
          for r in $(seq 1 24); do
            hey -z 10s -c 20 -m POST -T application/json -d "$body" http://127.0.0.1:18080/ > /dev/null
            echo "$r,$(awk '/VmRSS/{print $2}' /proc/$pid/status)" >> soak.csv
          done
          cat soak.csv
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = [int(r["vmrss_kb"]) for r in csv.DictReader(open("soak.csv"))]
          warm, last = rows[3], rows[-1]          # round 4 = after warm-up
          growth = (last - warm) * 100 / warm
          print("## Memory leak soak (bash + hey)")
          print(f"- **VmRSS after warm-up (round 4):** {warm} kB")
          print(f"- **VmRSS after round 24:** {last} kB ({growth:+.1f}%)")
          print(f"- **Peak:** {max(rows)} kB")
          if growth > 25:
              print(f"::warning::VmRSS grew {growth:.1f}% after warm-up; look at soak.csv")
          PY
      - name: Stop background processes
        if: always()
        run: kill $(cat upstream.pid nw.pid 2>/dev/null) 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: soak-results
          path: |
            soak.csv
            nw.err
          if-no-files-found: ignore
