name: Publish to Official MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the Official MCP Publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo modelcontextprotocol/registry \
            --pattern 'mcp-publisher_linux_amd64.tar.gz' --dir publisher-download --clobber
          tar xzf publisher-download/mcp-publisher_linux_amd64.tar.gz -C publisher-download
          cp publisher-download/mcp-publisher ./mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Check server.json is the one being published
        run: |
          cat server.json
          grep -q '"name": "io.github.VoxNode-ux/nullwire-mcp"' server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the registry
        run: ./mcp-publisher publish