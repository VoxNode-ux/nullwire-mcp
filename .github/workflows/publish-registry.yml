name: Publish to Official MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the Official MCP Publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo modelcontextprotocol/registry \
            --pattern '*linux*amd64*' --dir publisher-download --clobber
          ls -la publisher-download
          cd publisher-download
          for f in *; do
            case "$f" in *.tar.gz) tar xzf "$f" ;; esac
          done
          BIN=$(find . -type f -name 'mcp-publisher*' ! -name '*.tar.gz' ! -name '*.txt' ! -name '*.sha256' | head -1)
          cp "$BIN" ../mcp-publisher
          cd ..
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Check server.json is the one being published
        run: |
          cat server.json
          grep -q '"name": "io.github.VoxNode-ux/nullwire-mcp"' server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the registry
        run: ./mcp-publisher publish