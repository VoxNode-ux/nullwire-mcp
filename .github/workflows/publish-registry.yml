name: Publish to Official MCP Registry

on:
  # Automatic: every stable version tag (v1.2.3). Pre-release tags are ignored.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the Official MCP Publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo modelcontextprotocol/registry \
            --pattern 'mcp-publisher_linux_amd64.tar.gz' --dir publisher-download --clobber
          tar xzf publisher-download/mcp-publisher_linux_amd64.tar.gz -C publisher-download
          cp publisher-download/mcp-publisher ./mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Check server.json is the one being published
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cat server.json
          grep -q '"name": "io.github.VoxNode-ux/nullwire-mcp"' server.json
          if [ "$REF_TYPE" = "tag" ]; then
            want="${REF_NAME#v}"
            have=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' server.json | tail -n 1)
            if [ "$have" != "$want" ]; then
              echo "::error::server.json says version $have but the tag is $REF_NAME. Bump server.json (and npm/package.json) before tagging."
              exit 1
            fi
          fi

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the registry
        run: ./mcp-publisher publish
