name: Publish to Official MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the Official MCP Publisher
        run: |
          curl -fsSL -o mcp-publisher "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher-linux-amd64"
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Check server.json is the one being published
        run: |
          cat server.json
          grep -q '"name": "io.github.VoxNode-ux/nullwire-mcp"' server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the registry
        run: ./mcp-publisher publish