name: Security checks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"   # Mondays 03:23 UTC, on the default branch

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan the code and the Go standard library it uses
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee govulncheck.txt
      - name: Save the vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: govulncheck-report
          path: govulncheck.txt
          retention-days: 30

  fuzz:
    name: Fuzz the scrubber (${{ matrix.target }})
    # Runs weekly on main and on demand.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzScrubberNoLeak, FuzzScrubberDeterministic, FuzzScrubberNoPanic, FuzzVendorKeysNoLeak, FuzzIPv6NoLeak, FuzzIPv6Stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Show the Go version
        run: go version
      - name: Check that the fuzz build compiles (shows the real compiler error)
        run: |
          set -o pipefail
          {
            echo "== go vet =="; go vet ./... 2>&1
            echo "== go test -c =="; go test -c -o /dev/null . 2>&1
            echo "== fuzz build (1 execution) =="
            go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=1x . 2>&1
          } | tee fuzz-build-${{ matrix.target }}.log
      - name: Run fuzzing for 2 minutes
        run: |
          set -o pipefail
          go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=120s . 2>&1 | tee fuzz-${{ matrix.target }}.log
      - name: Save the fuzz log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-log-${{ matrix.target }}
          path: |
            fuzz-${{ matrix.target }}.log
            fuzz-build-${{ matrix.target }}.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep any failing input for reproduction
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30

  gosec:
    name: Security patterns in the Go code (gosec)
    runs-on: ubuntu-24.04
    continue-on-error: true   # advisory until the first findings are triaged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
      - name: Scan (medium severity and above)
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/gosec" -exclude-generated -severity medium -confidence medium ./... 2>&1 | tee gosec.txt
      - name: Save the gosec report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gosec-report
          path: gosec.txt
          retention-days: 30
