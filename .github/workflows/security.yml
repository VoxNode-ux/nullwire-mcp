name: Security checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan the code and the Go standard library it uses
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/govulncheck" ./... | tee govulncheck.txt
      - name: Save the vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: govulncheck-report
          path: govulncheck.txt
          retention-days: 30

  fuzz:
    name: Fuzz the scrubber (${{ matrix.target }})
    # The whole workflow only runs when started by hand.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzScrubberNoLeak, FuzzScrubberDeterministic, FuzzScrubberNoPanic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Run fuzzing for 2 minutes
        run: |
          set -o pipefail
          go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=120s . | tee fuzz-${{ matrix.target }}.log
      - name: Save the fuzz log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-log-${{ matrix.target }}
          path: fuzz-${{ matrix.target }}.log
          retention-days: 30
      - name: Keep any failing input for reproduction
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
