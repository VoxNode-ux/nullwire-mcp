name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 2 * * 1"   # weekly, Monday 02:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # upload results to the Security tab
      id-token: write          # publish the public score and badge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        run: |
          go install github.com/ossf/scorecard/v4/cmd/scorecard@latest
          "$(go env GOPATH)/bin/scorecard" --repo="$GITHUB_REPOSITORY" --format=sarif > results.sarif || true

      - name: Save the Scorecard report
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Show results in the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
