name: OpenSSF Scorecard

on:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Run Scorecard (official image from GitHub Container Registry)
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          docker run --rm -e GITHUB_AUTH_TOKEN \
            ghcr.io/ossf/scorecard:latest \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --show-details | tee scorecard.txt

      - name: Save the Scorecard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-report
          path: scorecard.txt
          retention-days: 30
