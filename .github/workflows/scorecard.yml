name: OpenSSF Scorecard

# Runs Scorecard on the default branch and publishes the result to the public
# Scorecard API (api.scorecard.dev), which powers the README badge.
#
# Publishing has rules this file follows: the workflow has no top-level env or
# defaults, the job runs on a GitHub-hosted Ubuntu runner with no container,
# and its steps use only actions/checkout, actions/upload-artifact and
# ossf/scorecard-action. Only runs on the default branch are published.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 3"
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read # the job below sets its own permissions, which replace these

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write # lets the action publish results with a GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Save the Scorecard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-report
          path: results.sarif
          retention-days: 5
