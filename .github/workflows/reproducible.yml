name: Reproducible build check

# Builds the same commit on several different runners and fails if the
# binaries are not bit-for-bit identical.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Build the same targets as release.yml
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p out
          go version | tee out/go-version.txt
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "out/nullwire-$os-$arch$ext" .
          done
          cd out
          for f in nullwire-*; do
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done > sums.txt
          cat sums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sums-${{ matrix.os }}
          path: out/sums.txt
          retention-days: 7

  compare:
    name: Compare the checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sums-*
          path: sums
      - name: Every runner must produce identical files
        run: |
          set -euo pipefail
          cd sums
          first=$(ls | head -n 1)
          status=0
          for d in *; do
            if ! diff -u "$first/sums.txt" "$d/sums.txt"; then
              echo "::error::$d built different binaries than $first"
              status=1
            fi
          done
          [ "$status" = 0 ] && echo "All runners produced identical binaries." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"