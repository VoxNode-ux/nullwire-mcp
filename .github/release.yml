# Release notes are generated by `gh release create --generate-notes` in
# release.yml and grouped by the labels below. Label a pull request (or use a
# conventional-commit prefix in its title and label it to match).
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: "💥 Breaking changes"
      labels: [breaking]
    - title: "✨ New features"
      labels: [feature, enhancement]
    - title: "🐛 Fixes"
      labels: [bug, fix]
    - title: "🔐 Security"
      labels: [security]
    - title: "⚡ Performance"
      labels: [performance]
    - title: "📦 Packaging and distribution"
      labels: [packaging, distribution]
    - title: "🧪 Tests and CI"
      labels: [ci, tests]
    - title: "📚 Documentation"
      labels: [documentation, docs]
    - title: "Other changes"
      labels: ["*"]